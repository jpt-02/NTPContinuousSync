[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysync"
version = "0.1.0"
description = "Provides a clock that continuously syncs with NTP and learns to be more accurate over time."
readme = "README.md"
requires-python = ">=3.13.0"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ntplib==0.4.0",
    "pandas==3.0.3",
    "plotly==6.8.0"
]

[project.urls]
"Homepage" = "https://github.com/jpt-02/NTPContinuousSync"
"Bug Tracker" = "https://github.com/jpt-02/NTPContinuousSync/issues"

[tool.setuptools.packages.find]
where = ["src"]